<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<header>
    <h1>Cadastro</h1>
</header>
<body>
    <form action="cadastraCliente.php">
        <fieldset>
            <legend>
                Dados Pessoais
            </legend>
            <div>
                <label for="nome">Nome: </label><input type="text" placeholder="Informe nome completo" autofocus required>
            </div>
            <div>
                <label for="E-mail"> E-mail:</label>
                <input type="email" name="E-mail" id="email" required>
            </div>
            <div>
                <label for="CPF">CPF: </label>
                <input type="text" pattern="\d{3}\.\d{3}.\d{3}-\d{2}" placeholder="xxx.xxx.xxx-xx" required>
            </div>
            <div>
                <label for="Idade">Idade:</label>
                <input type="number" required>
            </div>
            <div>
                <label for="Telefone">Telefone:</label>
                <input type="tel" required>
            </div>
            <div>
                <label for="datadeNascimento">Data de Nascimento: </label>
                <input type="date" > 
            </div>
            <div>
                <label for="Sexo">Sexo: </label>
                <input type="radio" id="feminino" value="feminino"><label for="feminino">Feminino</label>
                <input type="radio" id="masculino"><label for="masculino">Masculino</label>
            </div>
            <div>
                <label for="EstadoCivil">Estado Civil: </label>
                <input type="radio" id="solteiro" name="estadocivil" value="solteiro"><label for="solteiro">Solteiro</label>
                <input type="radio" id="casado" name="estadocivil" value="casado"><label for="casado">Casado</label>
                <input type="radio" id="divorciado" name="estadocivil" value="divorciado"><label for="divorciado">Divorciado</label>
            </div>

            <div>
                <label for="infos">Infos:</label>
                <textarea name="infos" id="infos" readonly> Você é humano</textarea>
            </div>


        </fieldset>
        <fieldset>
            <legend>Endereço</legend>
            <div>
                <label for="cep">CEP:</label><input type="text" required>
            </div>

            <div>
                <label for="tipo">Tipo de logadouro</label>
            </div>

            <div>
                <input type="radio" id="rua" name="logadouro[]" value="rua" required><label for="rua">Rua</label> 
            </div>

            <div>
                <input type="radio" id="avenida" name="logadouro[]" value="avenida" required><label for="avenida">Avenida</label>
            </div>

            <div>
                <input type="radio" id="praca" name="logadouro[]" value="praca" required><label for="praca">Praça</label> 
            </div>

            <div>
                <label for="logadouro">Logadouro: </label> <input type="text" required>
            </div>

            <div>
                <label for="bairro">Bairro: </label><input type="text" required>
            </div>

            <div>
                <label for="cidade">Cidade: </label><input type="text" required>
            </div>

            <div>
                <label for="estado">Estado: </label>

                <select name="estado" required>
                    <option value="AM" selected>Amazonas</option>
                    <option value="MG" >Minas Gerais</option>
                    <option value="SP" >São Paulo</option>
                    <option value="Ba" >Bahia</option>
                    <option value="outro" >Outros</option>
                </select>
            </div>          

        </fieldset>

        <fieldset>
            <legend>Informações Adicionais</legend>
            <div>
                <input type="checkbox" name="hobbies" id="games" value="games" checked>
                <label for="games">Games</label>
            </div>

            <div>
                <input type="checkbox" name="hobbies" id="filmes" value="filmes" >
                <label for="filmes">Filmes</label>
            </div>

            <div>
                <input type="checkbox" name="hobbies" id="livros" value="livros">
                <label for="livros">Livros</label>
            </div>

            <div>
                <input type="checkbox" name="hobbies" id="esportes" value="esportes" >
                <label for="esportes">Esportes</label> 
            </div>

            <div>
                <input type="checkbox" name="hobbies" id="informatica" value="informatica">
                <label for="informatica">informática</label> 
            </div>

        </fieldset>
        <fieldset>
            <div>
                <legend>Deixe um comentario</legend>
                <textarea name="texto" id="te" cols="30" rows="10" minlength="2" maxlength="50" placeholder="O que achou da página" 
                required ></textarea>
            </div>
        
        </fieldset>
        <input type="file" name="meuArq">
        <button>Enviar</button>
    </form>

    
</body>
</html>
